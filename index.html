<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Section -->
    <section id="loginSection" class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <img src="assets/github-logo.png" alt="GitHub" class="github-logo">
            </div>
            <h1 class="login-title">GitHub Issues Tracker</h1>
            <p class="login-subtitle">Sign in to manage your issues</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter Username" required>
                    <small class="form-hint">Default: admin</small>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter Password" required>
                    <small class="form-hint">Default: admin123</small>
                </div>
                
                <button type="submit" class="btn-primary btn-signin">Sign In</button>
            </form>
            
            <div class="divider">
                <span>OR</span>
            </div>
            
            <div class="demo-credentials">
                <p class="demo-title">Demo Credentials:</p>
                <div class="credentials-box">
                    <p><strong>Username:</strong> admin</p>
                    <p><strong>Password:</strong> admin123</p>
                </div>
            </div>
            
            <div id="loginError" class="error-message"></div>
        </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" class="dashboard-container" style="display: none;">
        <nav class="navbar">
            <div class="nav-left">
                <img src="assets/github-logo.png" alt="GitHub" class="nav-logo">
                <h1 class="nav-title">GitHub Issues Tracker</h1>
            </div>
            <div class="nav-right">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search issues...">
                    <button id="searchBtn" class="btn-search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
                <button class="btn-new-issue">+ New Issue</button>
            </div>



        </nav>

        <main class="main-content">
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="all">All</button>
                    <button class="tab-btn" data-tab="open">Open</button>
                    <button class="tab-btn" data-tab="closed">Closed</button>
                </div>
                
                <div class="issues-info">
                    <div class="aperture-icon">
                        <img src="assets/Aperture.png" alt="Aperture" class="aperture-logo">
                    </div>
                    <div class="issues-count">
                        <h2 id="issuesCount">0 Issues</h2>
                        <p>Track and manage your project issues</p>
                    </div>
                </div>
                
                <div class="status-legend">
                    <div class="legend-item">
                        <span class="status-dot open"></span>
                        <span>Open</span>
                    </div>
                    <div class="legend-item">
                        <span class="status-dot closed"></span>
                        <span>Closed</span>
                    </div>
                </div>
            </div>

            <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
            </div>

            <div id="issuesGrid" class="issues-grid"></div>
        </main>
    </section>

    <div id="issueModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
